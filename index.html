<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Buku Tamu Digital</h1>
    </header>
    <main>
        <section>
            <h2>Formulir</h2>
            <form id="form">
                <ul>
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" required>
                </ul>
                <ul>
                    <label for="asal"> Instansi/Asal</label>
                    <input type="text" id="asal" required>
                </ul>
                <ul>
                    <label for="TK">Tujuan Kunjungan</label>
                    <select name="TK" id="TK">
                        <option value="">Pilih Tujuan Anda</option>
                        <option value="rapat">Rapat</option>
                        <option value="studiBanding">Studi Banding</option>
                        <option value="penelitian">Penelitian/Riset</option>
                        <option value="kunjungan">Kunjungan Kerja</option>
                        <option value="dll">Lainnya</option>
                    </select>
                </ul>
                <ul>
                    <label for="catatan">Catatan/Pesan</label>
                    <textarea name="catatan" id="catatan"></textarea>
                </ul>
                <ul><button type="submit">Submit</button></ul>
            </form>
        </section>

        <section>
            <h2>Daftar Tamu</h2>
            <table id="table" border="2">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Lengkap</th>
                        <th>Instansi/Asal</th>
                        <th>Tujuan Kunjungan</th>
                        <th>Catatan/pesan</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; Buku Tamu Digital 2026</p>
    </footer>

    <script src="script.js"></script>
   
</body>
</html>
